  </g>
  <!-- arrows -->
  <g stroke="#9aa0a6" stroke-width="3" fill="#9aa0a6">
    <line x1="260" y1="330" x2="330" y2="330"/>
    <polygon points="330,330 318,324 318,336"/>
    <line x1="540" y1="330" x2="610" y2="330"/>
    <polygon points="610,330 598,324 598,336"/>
    <line x1="820" y1="330" x2="890" y2="330"/>
    <polygon points="890,330 878,324 878,336"/>
  </g>
  <text x="600" y="480" text-anchor="middle" fill="#9aa0a6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Model chooses · harness is the only thing that runs</text>
  <text x="600" y="560" text-anchor="middle" fill="#6b7280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">MLH Builders Week 2026</text>
