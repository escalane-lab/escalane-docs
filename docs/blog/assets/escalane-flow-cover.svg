<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#1a1d23"/>
  <text x="600" y="90" text-anchor="middle" fill="#e8eaed" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600">Decide then Act</text>
  <text x="600" y="130" text-anchor="middle" fill="#9aa0a6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Escalane / sysone-ops · catalog-bound SysOps harness</text>
  <!-- boxes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <rect x="60" y="280" width="200" height="100" rx="16" fill="#2a3038" stroke="#5eead4" stroke-width="2"/>
    <text x="160" y="340" fill="#e8eaed">Ingest</text>
    <rect x="340" y="280" width="200" height="100" rx="16" fill="#2a3038" stroke="#5eead4" stroke-width="2"/>
    <text x="440" y="340" fill="#e8eaed">Decide</text>
    <rect x="620" y="280" width="200" height="100" rx="16" fill="#2a3038" stroke="#fbbf24" stroke-width="2"/>
